<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Notas</title>

    <link rel="stylesheet" href="Estilos - CSS/style.css">
</head>

<body>

    <main class="login">
        <h1>Sistema de Notas</h1>

        <form id="formLogin">
            <input
                type="email"
                id="email"
                placeholder="E-mail"
                required
            >

            <input
                type="password"
                id="senha"
                placeholder="Senha"
                required
            >

            <button type="submit">Entrar</button>

            <p id="mensagem"></p>
        </form>
    </main>

    <script type="module" src="JavaScript - JS/script.js"></script>

</body>

</html>
